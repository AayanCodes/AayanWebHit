<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hex Shield Glow -->
  <polygon points="50,6 94,30 94,70 50,94 6,70 6,30" fill="#04040d" stroke="url(#iconGrad)" stroke-width="3" filter="url(#iconGlow)" />
  <polygon points="50,10 90,32 90,68 50,90 10,68 10,32" fill="rgba(108, 99, 255, 0.15)" />

  <!-- Modern Stylized Geometric 'A' + 'W' + Digital Lightning Accent -->
  <path d="M50 20 L26 76 L40 76 L46 61 L54 61 L60 76 L74 76 Z" fill="url(#iconGrad)" />
  <polygon points="50,34 43,53 57,53" fill="#04040d" />

  <!-- Dynamic Web Spark Vector -->
  <path d="M50 41 L56 52 L48 53 L53 66 L41 54 L49 53 Z" fill="#00ffff" />

  <!-- Neon corner dots -->
  <circle cx="50" cy="6" r="3.5" fill="#00d4ff" />
  <circle cx="94" cy="30" r="3" fill="#6c63ff" />
  <circle cx="94" cy="70" r="3" fill="#9d4edd" />
  <circle cx="50" cy="94" r="3.5" fill="#00d4ff" />
  <circle cx="6" cy="70" r="3" fill="#6c63ff" />
  <circle cx="6" cy="30" r="3" fill="#9d4edd" />
</svg>
