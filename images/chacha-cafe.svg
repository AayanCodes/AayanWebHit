<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c08"/>
      <stop offset="50%" stop-color="#1c140c"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261a10" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#170f08" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Ambient Lights -->
  <circle cx="700" cy="100" r="180" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="150" fill="#ef4444" opacity="0.1" filter="url(#glow)"/>

  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#140f09"/>
  <rect x="0" y="26" width="800" height="16" fill="#140f09"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="100" y="10" width="460" height="22" rx="11" fill="#241a10" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="120" y="25" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500">https://chacha-cafe-restaurant.vercel.app</text>

  <!-- Status Badge -->
  <rect x="680" y="11" width="96" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="692" cy="21" r="3.5" fill="#10b981"/>
  <text x="702" y="25" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">LIVE SITE</text>

  <!-- Website Content Preview -->
  <!-- Top Nav in Mockup -->
  <rect x="40" y="62" width="720" height="44" rx="22" fill="#1a120b" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <text x="65" y="89" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">CHACHA CAFE</text>
  <text x="195" y="88" fill="#d97706" font-family="sans-serif" font-size="11" font-weight="600">&amp; RESTAURANT</text>
  
  <text x="440" y="88" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Home</text>
  <text x="495" y="88" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Menu</text>
  <text x="548" y="88" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Specials</text>
  <text x="615" y="88" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="500">Contact</text>
  <rect x="675" y="70" width="70" height="28" rx="14" fill="url(#goldGrad)"/>
  <text x="687" y="88" fill="#1c140c" font-family="sans-serif" font-size="11" font-weight="800">Book Table</text>

  <!-- Hero Banner in Mockup -->
  <rect x="40" y="120" width="720" height="220" rx="16" fill="url(#cardGrad)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  
  <!-- Left Hero Details -->
  <rect x="65" y="145" width="130" height="22" rx="11" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <text x="77" y="160" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">★ AUTHENTIC TASTE</text>

  <text x="65" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900">Experience Delicious</text>
  <text x="65" y="235" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900">Dining &amp; Fresh Flavors</text>
  
  <text x="65" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="400">Discover hand-crafted recipes, sizzling sizzlers, warm beverages</text>
  <text x="65" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="400">and cozy family ambience at Chacha Cafe.</text>

  <rect x="65" y="305" width="120" height="34" rx="8" fill="url(#goldGrad)"/>
  <text x="85" y="327" fill="#1c140c" font-family="sans-serif" font-size="12" font-weight="800">Explore Menu →</text>

  <rect x="195" y="305" width="115" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
  <text x="210" y="327" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Reserve Table</text>

  <!-- Right Visual Cards (Mock Food Items) -->
  <g transform="translate(480, 138)">
    <rect width="250" height="184" rx="14" fill="#140e08" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
    
    <!-- Food badge -->
    <rect x="15" y="15" width="220" height="75" rx="10" fill="#2d1c10"/>
    <circle cx="50" cy="52" r="24" fill="#fbbf24" opacity="0.3"/>
    <text x="50" y="58" text-anchor="middle" font-size="24">☕</text>
    <text x="88" y="44" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Artisan Roast Coffee</text>
    <text x="88" y="62" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Special Blend • ₹149</text>
    <rect x="88" y="70" width="70" height="12" rx="6" fill="#10b981" opacity="0.3"/>
    <text x="96" y="79" fill="#10b981" font-size="9" font-weight="800">Best Seller</text>

    <!-- Dish 2 -->
    <rect x="15" y="100" width="220" height="70" rx="10" fill="#22150c"/>
    <circle cx="50" cy="135" r="22" fill="#ef4444" opacity="0.3"/>
    <text x="50" y="141" text-anchor="middle" font-size="22">🍕</text>
    <text x="88" y="127" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Woodfired Gourmet Pizza</text>
    <text x="88" y="145" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="600">Fresh Mozzarella • ₹299</text>
  </g>

  <!-- 3 Mini Feature Cards at Bottom -->
  <g transform="translate(40, 355)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="225" height="110" rx="12" fill="#17100a" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <circle cx="35" cy="35" r="16" fill="rgba(245,158,11,0.2)"/>
    <text x="35" y="40" text-anchor="middle" font-size="16">🍽️</text>
    <text x="60" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Curated Menu</text>
    <text x="20" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Dozens of handcrafted gourmet dishes and starters.</text>

    <!-- Feature 2 -->
    <rect x="245" y="0" width="230" height="110" rx="12" fill="#17100a" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <circle cx="280" cy="35" r="16" fill="rgba(16,185,129,0.2)"/>
    <text x="280" y="40" text-anchor="middle" font-size="16">📅</text>
    <text x="305" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Online Reservation</text>
    <text x="265" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Instant seat booking with guaranteed table placement.</text>

    <!-- Feature 3 -->
    <rect x="495" y="0" width="225" height="110" rx="12" fill="#17100a" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <circle cx="530" cy="35" r="16" fill="rgba(239,68,68,0.2)"/>
    <text x="530" y="40" text-anchor="middle" font-size="16">🛵</text>
    <text x="555" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Quick Delivery</text>
    <text x="515" y="70" fill="#94a3b8" font-family="sans-serif" font-size="11">Fast contactless delivery across the region.</text>
  </g>
</svg>
