<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="50%" stop-color="#08182f"/>
      <stop offset="100%" stop-color="#030811"/>
    </linearGradient>
    <linearGradient id="solarCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="solarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="solarCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d213f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#071324" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#solarBg)"/>
  
  <!-- Ambient Lights -->
  <circle cx="720" cy="80" r="160" fill="#00f2fe" opacity="0.16" filter="url(#solarGlow)"/>
  <circle cx="100" cy="420" r="180" fill="#f59e0b" opacity="0.12" filter="url(#solarGlow)"/>

  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#08101e"/>
  <rect x="0" y="26" width="800" height="16" fill="#08101e"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="rgba(0,242,254,0.2)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="100" y="10" width="460" height="22" rx="11" fill="#0f1d33" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
  <text x="120" y="25" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500">https://flash-solar-dashboard.vercel.app</text>

  <!-- Status Badge -->
  <rect x="680" y="11" width="96" height="20" rx="10" fill="rgba(0,242,254,0.15)" stroke="#00f2fe" stroke-width="1"/>
  <circle cx="692" cy="21" r="3.5" fill="#00f2fe"/>
  <text x="702" y="25" fill="#00f2fe" font-family="sans-serif" font-size="10" font-weight="700">ONLINE</text>

  <!-- App Header inside Mockup -->
  <rect x="30" y="56" width="740" height="44" rx="10" fill="#0b172a" stroke="rgba(0,242,254,0.2)" stroke-width="1"/>
  <text x="50" y="83" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900">⚡ FLASH SOLAR</text>
  <text x="180" y="83" fill="url(#solarCyan)" font-family="sans-serif" font-size="12" font-weight="700">INTELLIGENT ENERGY SYSTEM</text>

  <rect x="600" y="66" width="150" height="24" rx="6" fill="#142642"/>
  <circle cx="615" cy="78" r="4" fill="#10b981"/>
  <text x="626" y="82" fill="#e2e8f0" font-family="sans-serif" font-size="11">System: Optimal 98.4%</text>

  <!-- KPI Metric Cards (Row 1) -->
  <!-- Metric 1: Power Generated -->
  <g transform="translate(30, 112)">
    <rect width="170" height="96" rx="12" fill="url(#solarCard)" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">LIVE GENERATION</text>
    <text x="16" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900">8.42</text>
    <text x="75" y="62" fill="url(#solarCyan)" font-family="sans-serif" font-size="14" font-weight="700">kW</text>
    <text x="16" y="82" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">▲ +14.2% vs yesterday</text>
  </g>

  <!-- Metric 2: Today's Yield -->
  <g transform="translate(220, 112)">
    <rect width="170" height="96" rx="12" fill="url(#solarCard)" stroke="rgba(251,191,36,0.3)" stroke-width="1"/>
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">DAILY HARVEST</text>
    <text x="16" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900">42.8</text>
    <text x="75" y="62" fill="url(#solarAmber)" font-family="sans-serif" font-size="14" font-weight="700">kWh</text>
    <text x="16" y="82" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">☀️ Peak Sun: 5.6 hrs</text>
  </g>

  <!-- Metric 3: Battery Storage -->
  <g transform="translate(410, 112)">
    <rect width="170" height="96" rx="12" fill="url(#solarCard)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">BATTERY CAPACITY</text>
    <text x="16" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900">94%</text>
    <text x="75" y="62" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">CHARGED</text>
    <text x="16" y="82" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">⚡ 13.8 kWh Reserve</text>
  </g>

  <!-- Metric 4: Carbon Offset -->
  <g transform="translate(600, 112)">
    <rect width="170" height="96" rx="12" fill="url(#solarCard)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">CO₂ SAVINGS</text>
    <text x="16" y="62" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900">318</text>
    <text x="65" y="62" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700">kg</text>
    <text x="16" y="82" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700">🌱 Equivalent 14 trees</text>
  </g>

  <!-- Central Chart & Visual Analytics Area -->
  <g transform="translate(30, 222)">
    <!-- Chart Box -->
    <rect width="470" height="248" rx="14" fill="url(#solarCard)" stroke="rgba(0,242,254,0.25)" stroke-width="1"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Power Generation Curve (24 Hours)</text>
    <text x="20" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11">Real-time solar irradiance &amp; inverter output (kW)</text>
    
    <!-- Grid Lines -->
    <line x1="20" y1="80" x2="450" y2="80" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="20" y1="120" x2="450" y2="120" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="20" y1="160" x2="450" y2="160" stroke="#1e293b" stroke-dasharray="4"/>
    <line x1="20" y1="200" x2="450" y2="200" stroke="#1e293b" stroke-dasharray="4"/>

    <!-- Wave Chart Path -->
    <path d="M 20 200 Q 80 195 120 170 T 200 85 T 280 60 T 360 110 T 420 185 L 450 200" fill="none" stroke="url(#solarCyan)" stroke-width="3.5"/>
    <path d="M 20 200 Q 80 195 120 170 T 200 85 T 280 60 T 360 110 T 420 185 L 450 200 L 450 210 L 20 210 Z" fill="url(#solarCyan)" opacity="0.12"/>
    
    <!-- Secondary Grid curve -->
    <path d="M 20 190 Q 90 180 140 150 T 230 110 T 310 95 T 390 140 T 450 180" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3"/>

    <!-- Chart Time Labels -->
    <text x="20" y="225" fill="#64748b" font-size="10">04:00</text>
    <text x="100" y="225" fill="#64748b" font-size="10">08:00</text>
    <text x="200" y="225" fill="#00f2fe" font-size="10" font-weight="700">12:00 (Peak)</text>
    <text x="310" y="225" fill="#64748b" font-size="10">16:00</text>
    <text x="410" y="225" fill="#64748b" font-size="10">20:00</text>
  </g>

  <!-- Right Inverter & System Nodes -->
  <g transform="translate(520, 222)">
    <rect width="250" height="248" rx="14" fill="url(#solarCard)" stroke="rgba(0,242,254,0.25)" stroke-width="1"/>
    <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Inverter &amp; Node Status</text>
    
    <!-- Node 1 -->
    <rect x="15" y="50" width="220" height="52" rx="8" fill="#081426" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="35" cy="76" r="6" fill="#10b981"/>
    <text x="52" y="70" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Inverter Array A1</text>
    <text x="52" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10">Efficiency: 99.1% • 420V DC</text>

    <!-- Node 2 -->
    <rect x="15" y="112" width="220" height="52" rx="8" fill="#081426" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="35" cy="138" r="6" fill="#10b981"/>
    <text x="52" y="132" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Inverter Array A2</text>
    <text x="52" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10">Efficiency: 98.7% • 415V DC</text>

    <!-- Node 3: Grid Sync -->
    <rect x="15" y="174" width="220" height="52" rx="8" fill="#081426" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
    <circle cx="35" cy="200" r="6" fill="#00f2fe"/>
    <text x="52" y="194" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Smart Grid Sync</text>
    <text x="52" y="212" fill="#00f2fe" font-family="sans-serif" font-size="10">Exporting 3.8 kW to Grid</text>
  </g>
</svg>
