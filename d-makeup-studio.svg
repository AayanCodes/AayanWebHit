<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="makeupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140711"/>
      <stop offset="50%" stop-color="#240c20"/>
      <stop offset="100%" stop-color="#0e040c"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="makeupCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34122d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e0a1b" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="makeupGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#makeupBg)"/>
  
  <!-- Ambient Lights -->
  <circle cx="700" cy="100" r="180" fill="#f472b6" opacity="0.18" filter="url(#makeupGlow)"/>
  <circle cx="120" cy="400" r="160" fill="#fb7185" opacity="0.12" filter="url(#makeupGlow)"/>

  <!-- Browser Chrome Top Bar -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#180715"/>
  <rect x="0" y="26" width="800" height="16" fill="#180715"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="64" cy="21" r="5.5" fill="#10b981"/>
  
  <!-- URL Bar -->
  <rect x="100" y="10" width="460" height="22" rx="11" fill="#2d0f28" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
  <text x="120" y="25" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500">https://d-makeup-studio.vercel.app</text>

  <!-- Status Badge -->
  <rect x="680" y="11" width="96" height="20" rx="10" fill="rgba(244,114,182,0.15)" stroke="#f472b6" stroke-width="1"/>
  <circle cx="692" cy="21" r="3.5" fill="#f472b6"/>
  <text x="702" y="25" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="700">LIVE STUDIO</text>

  <!-- Top Mockup Navigation -->
  <rect x="40" y="60" width="720" height="44" rx="22" fill="#220b20" stroke="rgba(244,114,182,0.25)" stroke-width="1"/>
  <text x="65" y="87" fill="url(#roseGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" letter-spacing="1">D-MAKEUP STUDIO</text>
  <text x="245" y="87" fill="#f9a8d4" font-family="sans-serif" font-size="11" font-weight="600">★ LUXURY BEAUTY</text>

  <text x="440" y="87" fill="#fbcfe8" font-family="sans-serif" font-size="12" font-weight="500">Home</text>
  <text x="495" y="87" fill="#fbcfe8" font-family="sans-serif" font-size="12" font-weight="500">Services</text>
  <text x="560" y="87" fill="#fbcfe8" font-family="sans-serif" font-size="12" font-weight="500">Gallery</text>
  <text x="620" y="87" fill="#fbcfe8" font-family="sans-serif" font-size="12" font-weight="500">Reviews</text>
  <rect x="675" y="68" width="72" height="28" rx="14" fill="url(#roseGold)"/>
  <text x="686" y="86" fill="#180715" font-family="sans-serif" font-size="11" font-weight="800">Book Now</text>

  <!-- Hero Banner inside Mockup -->
  <rect x="40" y="118" width="720" height="225" rx="16" fill="url(#makeupCard)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
  
  <!-- Left Hero Details -->
  <rect x="65" y="140" width="145" height="22" rx="11" fill="rgba(244,114,182,0.2)" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
  <text x="75" y="155" fill="#fda4af" font-family="sans-serif" font-size="10" font-weight="700">✨ CELEBRITY &amp; BRIDAL</text>

  <text x="65" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900">Unveil Your Divine</text>
  <text x="65" y="230" fill="url(#roseGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900">Elegance &amp; Glamour</text>
  
  <text x="65" y="265" fill="#f9a8d4" font-family="sans-serif" font-size="12" font-weight="400">Professional bridal makeovers, party glam, high-definition styling,</text>
  <text x="65" y="285" fill="#f9a8d4" font-family="sans-serif" font-size="12" font-weight="400">and personalized skincare treatments by expert makeup artists.</text>

  <rect x="65" y="300" width="130" height="32" rx="8" fill="url(#roseGold)"/>
  <text x="80" y="321" fill="#180715" font-family="sans-serif" font-size="12" font-weight="800">Book Appointment →</text>

  <rect x="205" y="300" width="115" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
  <text x="220" y="321" fill="#fda4af" font-family="sans-serif" font-size="12" font-weight="700">View Packages</text>

  <!-- Right Visual Cards (Mock Makeup Categories) -->
  <g transform="translate(485, 134)">
    <rect width="245" height="192" rx="14" fill="#1f0a1c" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
    
    <!-- Service 1 -->
    <rect x="15" y="15" width="215" height="76" rx="10" fill="#351230"/>
    <circle cx="50" cy="53" r="24" fill="#fb7185" opacity="0.3"/>
    <text x="50" y="59" text-anchor="middle" font-size="22">💄</text>
    <text x="86" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Signature Bridal Glam</text>
    <text x="86" y="62" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="600">HD Airbrush &amp; Hairstyling</text>
    <rect x="86" y="70" width="75" height="12" rx="6" fill="#f43f5e" opacity="0.4"/>
    <text x="94" y="79" fill="#fda4af" font-size="9" font-weight="800">Most Popular</text>

    <!-- Service 2 -->
    <rect x="15" y="102" width="215" height="74" rx="10" fill="#2a0d26"/>
    <circle cx="50" cy="139" r="22" fill="#e879f9" opacity="0.3"/>
    <text x="50" y="145" text-anchor="middle" font-size="20">✨</text>
    <text x="86" y="130" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Occasional &amp; Party Glow</text>
    <text x="86" y="148" fill="#e879f9" font-family="sans-serif" font-size="11" font-weight="600">Pre-event drape &amp; contour</text>
  </g>

  <!-- 3 Mini Service Cards at Bottom -->
  <g transform="translate(40, 355)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="225" height="110" rx="12" fill="#1c0919" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
    <circle cx="35" cy="35" r="16" fill="rgba(244,114,182,0.2)"/>
    <text x="35" y="40" text-anchor="middle" font-size="16">👑</text>
    <text x="60" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Bridal Couture</text>
    <text x="20" y="70" fill="#f472b6" font-family="sans-serif" font-size="11">Complete bridal makeover packages with trail sessions.</text>

    <!-- Feature 2 -->
    <rect x="245" y="0" width="230" height="110" rx="12" fill="#1c0919" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
    <circle cx="280" cy="35" r="16" fill="rgba(251,113,133,0.2)"/>
    <text x="280" y="40" text-anchor="middle" font-size="16">💅</text>
    <text x="305" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Nail &amp; Hair Spa</text>
    <text x="265" y="70" fill="#f472b6" font-family="sans-serif" font-size="11">Gel nail art, hair conditioning, and keratin smoothing.</text>

    <!-- Feature 3 -->
    <rect x="495" y="0" width="225" height="110" rx="12" fill="#1c0919" stroke="rgba(244,114,182,0.2)" stroke-width="1"/>
    <circle cx="530" cy="35" r="16" fill="rgba(232,121,249,0.2)"/>
    <text x="530" y="40" text-anchor="middle" font-size="16">📅</text>
    <text x="555" y="38" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Online Booking</text>
    <text x="515" y="70" fill="#f472b6" font-family="sans-serif" font-size="11">Book your desired makeup artist and slot with 1 click.</text>
  </g>
</svg>
