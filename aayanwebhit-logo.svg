<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="awhGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <linearGradient id="awhGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#6c63ff" />
    </linearGradient>
    <filter id="awhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex Shield Glow -->
    <polygon points="40,2 78,22 78,58 40,78 2,58 2,22" fill="#04040d" stroke="url(#awhGrad1)" stroke-width="2.5" filter="url(#awhGlow)" />
    
    <!-- Background subtle tint -->
    <polygon points="40,6 74,24 74,56 40,74 6,56 6,24" fill="rgba(108, 99, 255, 0.12)" />

    <!-- Modern Stylized Geometric 'A' + 'W' + Digital Lightning Accent -->
    <path d="M40 14 L20 62 L32 62 L37 49 L43 49 L48 62 L60 62 Z" fill="url(#awhGrad1)" />
    <!-- Apex cutout -->
    <polygon points="40,26 34,42 46,42" fill="#04040d" />

    <!-- Dynamic Web Spark / Hit Vector -->
    <path d="M40 33 L45 42 L38 43 L42 54 L32 44 L39 43 Z" fill="#00ffff" />

    <!-- Corner Neon Nodes -->
    <circle cx="40" cy="2" r="3" fill="#00d4ff" />
    <circle cx="78" cy="22" r="2.5" fill="#6c63ff" />
    <circle cx="78" cy="58" r="2.5" fill="#9d4edd" />
    <circle cx="40" cy="78" r="3" fill="#00d4ff" />
    <circle cx="2" cy="58" r="2.5" fill="#6c63ff" />
    <circle cx="2" cy="22" r="2.5" fill="#9d4edd" />
  </g>

  <!-- Typography Brand Name -->
  <g transform="translate(105, 15)">
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Poppins', sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="-0.5">
      Aayan<tspan fill="url(#awhGrad2)">WebHit</tspan>
    </text>
    <text x="2" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#00d4ff" letter-spacing="3.5" opacity="0.9">
      WEB DEVELOPMENT &amp; SOLUTIONS
    </text>
  </g>
</svg>
